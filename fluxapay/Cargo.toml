[package]
name = "fluxapay"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
# WASM Contract Selection Rule (Issue #1269):
# When compiling for WASM targets (`wasm32`), exactly ONE deployable `contract-*`
# feature must be selected per build artifact.
# - Zero contract features: rejected by build.rs with a diagnostic listing available options.
# - Multiple contract features: rejected by build.rs with a diagnostic listing conflicting features.
# Accidental multi-contract WASM artifacts risk symbol collisions and size limit violations.
#
# Non-WASM / native targets (tests, clippy, doc tests on host) intentionally allow
# multiple features (including `--all-features`) so full cross-contract test and
# lint suites continue to run without restriction.
#
# Default builds PaymentProcessor (the primary contract).
default = ["contract-payment-processor"]
contract-payment-processor = []
contract-payment-streaming = []
contract-refund-manager = []
contract-gas-estimator = []
contract-fx-oracle = []
contract-merchant-registry = []
contract-payment-link = []
contract-dex-router = []
contract-htlc = []

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1.4.0"
ed25519-dalek = "2.2.0"

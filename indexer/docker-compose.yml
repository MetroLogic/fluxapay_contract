# FluxaPay Indexer Docker Compose for local development
# Runs PostgreSQL and the event indexer service with REST API exposed

version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: fluxapay-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fluxapay
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fluxapay-indexer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/fluxapay
      SOROBAN_RPC_URL: http://stellar-quickstart:8000/soroban/rpc
      PAYMENT_PROCESSOR_CONTRACT_ID: ${PAYMENT_PROCESSOR_CONTRACT_ID:-CBNR5IXY5K7KCJ63PY3ZFYHG4U6F5C5I2PZ2ZQXDMQQNC6ZF63K65QQ}
      REFUND_MANAGER_CONTRACT_ID: ${REFUND_MANAGER_CONTRACT_ID:-CDRF5IXY5K7KCJ63PY3ZFYHG4U6F5C5I2PZ2ZQXDMQQNC6ZF63K65QQ}
      MERCHANT_REGISTRY_CONTRACT_ID: ${MERCHANT_REGISTRY_CONTRACT_ID:-CMRC5IXY5K7KCJ63PY3ZFYHG4U6F5C5I2PZ2ZQXDMQQNC6ZF63K65QQ}
      FX_ORACLE_CONTRACT_ID: ${FX_ORACLE_CONTRACT_ID:-CFXO5IXY5K7KCJ63PY3ZFYHG4U6F5C5I2PZ2ZQXDMQQNC6ZF63K65QQ}
      PAYMENT_LINK_MANAGER_CONTRACT_ID: ${PAYMENT_LINK_MANAGER_CONTRACT_ID:-CPLM5IXY5K7KCJ63PY3ZFYHG4U6F5C5I2PZ2ZQXDMQQNC6ZF63K65QQ}
      FLUXAPAY_CONTRACT_ID: ${FLUXAPAY_CONTRACT_ID:-}
      PORT: 3001
      API_KEY: ${API_KEY:-fluxapay_secret_api_key}
      POLL_INTERVAL_MS: 5000
      START_LEDGER: 0
      DLQ_RETRY_INTERVAL_MS: 60000
      DLQ_MIN_AGE_SECONDS: 60
    networks:
      - fluxapay-network
    restart: on-failure

volumes:
  postgres-data:

networks:
  fluxapay-network:
    driver: bridge

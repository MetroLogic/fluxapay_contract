[licenses]
version = 2
include-dev = false
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true

[advisories]
version = 2
unmaintained = "all"
unsound = "all"
ignore = []

[bans]
multiple-versions = "warn"
multiple-versions-include-dev = false
wildcards = "deny"
deny = []
# Keep this list limited to unavoidable crates, each with a specific version
# and a reason. Do not skip crates that are present in the production graph.
skip = []
skip-tree = []

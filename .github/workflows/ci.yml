name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  issues: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MAX_WASM_SIZE_KB: 100

# Cancel previous runs if a new one is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Check code formatting
  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: 1.85.0
          components: rustfmt

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Job 2: Lint with Clippy
  lint:
    name: Lint (Clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: 1.85.0
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check Documentation
        run: cargo doc --no-deps

  # Job 2b: Supply Chain & Security (cargo-deny & cargo-audit)
  cargo-deny:
    name: Cargo Deny Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses advisories

  cargo-audit:
    name: Cargo Audit Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Pre-install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Security audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Job 3: Build the contract
  build:
    name: Build Contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [format, lint, cargo-deny, cargo-audit]
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: 1.85.0
          targets: wasm32-unknown-unknown

      - name: Cache Stellar CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: cache-stellar-cli
        with:
          path: ~/.cargo/bin/stellar
          key: ${{ runner.os }}-stellar-cli-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        if: steps.cache-stellar-cli.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Stellar CLI
        if: steps.cache-stellar-cli.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli

      - name: Verify Stellar CLI
        run: stellar --version

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build contract
        working-directory: fluxapay
        run: stellar contract build

      - name: Optimize WASM contract
        working-directory: fluxapay
        run: |
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            if [ -f "$wasm" ]; then
              stellar contract optimize --wasm "$wasm"
            fi
          done

      - name: List build artifacts
        run: ls -lh target/wasm32-unknown-unknown/release/*.wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: fluxapay-contract-${{ github.sha }}
          path: target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 30

      - name: Check WASM size
        run: |
          echo "### WASM Contract Size 📦" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Contract | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            if [ -f "$wasm" ]; then
              size=$(ls -lh "$wasm" | awk '{print $5}')
              name=$(basename "$wasm")
              echo "| $name | $size |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Enforce WASM size limit
        run: |
          MAX_SIZE=$((MAX_WASM_SIZE_KB * 1024))
          echo "Max allowed size: $MAX_WASM_SIZE_KB KB ($MAX_SIZE bytes)"
          failed=0
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            if [ -f "$wasm" ]; then
              size=$(stat -c%s "$wasm")
              name=$(basename "$wasm")
              if [ "$size" -gt "$MAX_SIZE" ]; then
                echo "❌ Error: $name size is $size bytes, which exceeds the limit of $MAX_SIZE bytes!"
                failed=1
              else
                echo "✅ $name size is $size bytes (within limit)"
              fi
            fi
          done
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi

      # Issue #813: fail if primary WASM grows >5% vs committed baseline
      - name: Check WASM size regression
        run: |
          BASELINE_FILE=".wasm-size-baseline"
          if [ ! -f "$BASELINE_FILE" ]; then
            echo "Missing $BASELINE_FILE — commit a baseline (see CONTRIBUTING.md)"
            exit 1
          fi
          BASELINE=$(tr -d '[:space:]' < "$BASELINE_FILE")
          if ! [[ "$BASELINE" =~ ^[0-9]+$ ]]; then
            echo "Invalid baseline in $BASELINE_FILE: '$BASELINE'"
            exit 1
          fi
          # Prefer optimized fluxapay.wasm; fall back to any release wasm.
          WASM=""
          for candidate in \
            target/wasm32-unknown-unknown/release/fluxapay.optimized.wasm \
            target/wasm32-unknown-unknown/release/fluxapay.wasm \
            target/wasm32-unknown-unknown/release/*.wasm; do
            if [ -f "$candidate" ]; then
              WASM="$candidate"
              break
            fi
          done
          if [ -z "$WASM" ]; then
            echo "No WASM artifact found under target/wasm32-unknown-unknown/release/"
            exit 1
          fi
          SIZE=$(stat -c%s "$WASM")
          THRESHOLD=$(( BASELINE * 105 / 100 ))
          echo "WASM: $WASM"
          echo "Size: $SIZE bytes | Baseline: $BASELINE | 5% threshold: $THRESHOLD"
          echo "### WASM Size Regression (Issue #813)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | Size | Baseline | Threshold (baseline×1.05) | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|------|----------|---------------------------|--------|" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt "$THRESHOLD" ]; then
            echo "| $(basename "$WASM") | $SIZE | $BASELINE | $THRESHOLD | ❌ FAIL |" >> "$GITHUB_STEP_SUMMARY"
            echo "WASM size $SIZE exceeds 5% baseline growth (baseline: $BASELINE, threshold: $THRESHOLD)"
            exit 1
          fi
          echo "| $(basename "$WASM") | $SIZE | $BASELINE | $THRESHOLD | ✅ PASS |" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ WASM size within 5% of baseline"

  # Job 4: WASM Size Check
  wasm-size-check:
    name: WASM Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: 1.85.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Build contracts (release)
        working-directory: fluxapay
        run: |
          cargo build --target wasm32-unknown-unknown --release
          for feature in contract-payment-processor contract-refund-manager contract-gas-estimator contract-fx-oracle contract-merchant-registry contract-payment-link contract-payment-streaming; do
            cargo build --target wasm32-unknown-unknown --release --no-default-features --features "$feature"
          done

      - name: Check WASM sizes
        run: |
          MAX_SIZE=$((MAX_WASM_SIZE_KB * 1024))
          echo "Checking WASM contract sizes (max: $MAX_WASM_SIZE_KB KB = $MAX_SIZE bytes)"
          echo ""
          echo "### WASM Contract Sizes 📦" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Contract | Size (Bytes) | Size (KB) | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          failed=0
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            if [ -f "$wasm" ]; then
              size=$(stat -c%s "$wasm")
              name=$(basename "$wasm")
              size_kb=$((size / 1024))
              if [ "$size" -gt "$MAX_SIZE" ]; then
                echo "❌ FAIL: $name is $size_kb KB ($size bytes) (exceeds limit by $((size_kb - MAX_WASM_SIZE_KB)) KB)"
                echo "| $name | $size | ${size_kb} KB | ❌ Exceeds limit ($((size_kb - MAX_WASM_SIZE_KB)) KB over) |" >> $GITHUB_STEP_SUMMARY
                failed=1
              else
                echo "✅ PASS: $name is $size_kb KB ($size bytes) (within limit)"
                echo "| $name | $size | ${size_kb} KB | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo "Error: One or more WASM binaries exceeded the MAX_WASM_SIZE_KB limit ($MAX_WASM_SIZE_KB KB)"
            exit 1
          fi

  # Job 5: Run tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: 1.85.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: cargo test --verbose --all-features

  # Job 5b: Bounded property tests
  proptest:
    name: Property Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: 1.85.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-proptest-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-proptest-

      - name: Run bounded property tests
        run: "PROPTEST_CASES=256 cargo test -p fluxapay proptests:: --all-features -- --test-threads=1"

  # Job 6: Check SDK build, types, and JSDoc
  sdk-check:
    name: SDK Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      - name: Build SDK
        working-directory: sdk
        run: npm run build

      - name: Type check
        working-directory: sdk
        run: npx tsc --noEmit

      - name: Lint JSDoc annotations
        working-directory: sdk
        run: npm run lint:jsdoc

      - name: Check error map is in sync with contract source
        working-directory: sdk
        run: npm run check-error-map-sync

      - name: Check mainnet contract IDs
        run: node scripts/check-mainnet-contract-ids.js

  # Final job: Report overall status
  ci-success:
    name: CI Success
    if: ${{ always() }}
    needs: [format, lint, build, wasm-size-check, test, proptest, sdk-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.format.result }}" == "success" ]] && \
             [[ "${{ needs.lint.result }}" == "success" ]] && \
             [[ "${{ needs.build.result }}" == "success" ]] && \
             [[ "${{ needs.wasm-size-check.result }}" == "success" ]] && \
             [[ "${{ needs.test.result }}" == "success" ]] && \
             [[ "${{ needs.proptest.result }}" == "success" ]] && \
             [[ "${{ needs.sdk-check.result }}" == "success" ]]; then
            echo "✅ All CI checks passed!"
            exit 0
          else
            echo "❌ Some CI checks failed"
            exit 1
          fi
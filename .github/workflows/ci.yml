name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  issues: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MAX_WASM_SIZE_KB: 100

# Cancel previous runs if a new one is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Check code formatting
  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: 1.94.1
          components: rustfmt

      - name: Cache cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Keep production dependency bans, license policy, and advisories enforced.
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2

      - name: Check dependencies
        run: cargo deny check bans licenses advisories --warn unsound --warn unmaintained

  # Job 2: Lint with Clippy
  lint:
    name: Lint (Clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: 1.94.1
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check Documentation
        run: cargo doc --no-deps

  # Job 2b: Supply Chain & Security (cargo-deny & cargo-audit)
  cargo-deny:
    name: Cargo Deny Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses advisories

  cargo-audit:
    name: Cargo Audit Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Pre-install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Security audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Job 2c: Migration rollback test (Issue #991)
  # Runs against a fresh PostgreSQL service container so it shares no state
  # with other CI jobs. Applies all migrations, rolls them all back, then
  # re-applies them to prove the rollback path is not broken.
  migration-rollback:
    name: Migration Rollback Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: indexer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/indexer_test
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: indexer
        run: npm ci

      - name: Verify every migration has a down block
        working-directory: indexer
        run: |
          missing=0
          for f in migrations/*.sql; do
            case "$f" in
              *.down.sql) continue ;;
            esac
            base="${f%.sql}"
            if [ -f "${base}.down.sql" ]; then
              continue
            fi
            if grep -qiE '^\s*--\s*\+migrate\s+down' "$f"; then
              continue
            fi
            echo "::error file=$f::Migration $f has no rollback down block (expected a '-- +migrate Down' section or a ${base}.down.sql file)"
            missing=1
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more migrations are missing a rollback down block."
            exit 1
          fi

      - name: Apply all migrations
        working-directory: indexer
        run: npm run migrate:up

      - name: Roll back most recent migration
        working-directory: indexer
        run: npm run migrate:down

      - name: Re-apply migrations
        working-directory: indexer
        run: npm run migrate:up

      - name: Roll back all migrations
        working-directory: indexer
        run: npm run migrate:down:all

      - name: Re-apply all migrations after full rollback
        working-directory: indexer
        run: npm run migrate:up

  # Job 2d: Python SDK unit tests (Issue #992)
  # Runs the respx-mocked unit test suite for the Python SDK with coverage
  # enforcement so regressions in the SDK are caught before merge.
  python-sdk-tests:
    name: Python SDK Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        working-directory: sdk/python
        run: pytest --cov=fluxapay --cov-report=term-missing --cov-fail-under=90

  # Job 3: Build the contract
  build:
    name: Build Contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [format, lint, cargo-deny, cargo-audit]
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: 1.94.1
          targets: wasm32-unknown-unknown

      - name: Cache Stellar CLI
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        id: cache-stellar-cli
        with:
          path: ~/.cargo/bin/stellar
          key: ${{ runner.os }}-stellar-cli-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        if: steps.cache-stellar-cli.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Stellar CLI
        if: steps.cache-stellar-cli.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli

      - name: Verify Stellar CLI
        run: stellar --version

      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build contract
        working-directory: fluxapay
        run: stellar contract build

      - name: Optimize WASM contract
        working-directory: fluxapay
        run: |
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            if [ -f "$wasm" ]; then
              stellar contract optimize --wasm "$wasm"
            fi
          done

name: SDK Testnet Integration Tests

# Issue #661: Run the SDK's integration test suite (sdk/test/integration/)
# against real deployed Soroban testnet contracts. Intentionally NOT run on
# pull_request — these tests submit live testnet transactions and consume
# testnet keypair nonces/balances, so they only run on merge to main.
on:
  push:
    branches: [main]
    paths:
      - "sdk/**"

permissions:
  contents: read

jobs:
  integration:
    name: Testnet Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build SDK
        run: npm run build

      - name: Run integration tests
        run: npm run test:integration
        env:
          TESTNET_RPC_URL: ${{ secrets.TESTNET_RPC_URL }}
          TESTNET_PAYMENT_PROCESSOR_CONTRACT_ID: ${{ secrets.TESTNET_PAYMENT_PROCESSOR_CONTRACT_ID }}
          TESTNET_MERCHANT_REGISTRY_CONTRACT_ID: ${{ secrets.TESTNET_MERCHANT_REGISTRY_CONTRACT_ID }}
          TESTNET_ADMIN_SECRET_KEY: ${{ secrets.TESTNET_ADMIN_SECRET_KEY }}
          TESTNET_MERCHANT_SECRET_KEY: ${{ secrets.TESTNET_MERCHANT_SECRET_KEY }}
          TESTNET_PAYER_SECRET_KEY: ${{ secrets.TESTNET_PAYER_SECRET_KEY }}

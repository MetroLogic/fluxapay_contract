[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fluxapay-sdk"
version = "0.1.0"
description = "Async Python SDK for the FluxaPay payments API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "FluxaPay" }]
keywords = ["fluxapay", "payments", "sdk", "async", "httpx"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "httpx>=0.27,<0.29",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["fluxapay"]

[tool.hatch.build.targets.sdist]
include = ["fluxapay", "tests", "README.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
